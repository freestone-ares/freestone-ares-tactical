plugins {
    id 'com.android.application'
}

android {
    namespace 'org.freestone.ares'
    compileSdk 34

    signingConfigs {
        fieldRelease {
            storeFile file("${rootDir}/keystore/field.keystore")
            storePassword 'freestone_ares_field_2026'
            keyAlias 'freestone-ares'
            keyPassword 'freestone_ares_field_2026'
            storeType 'PKCS12'
        }
    }

    defaultConfig {
        applicationId "org.freestone.ares.tactical"
        minSdk 24
        targetSdk 34
        versionCode System.getenv("BUILD_NUMBER") ? System.getenv("BUILD_NUMBER").toInteger() : 29
        versionName "7.8.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.fieldRelease
        }
        debug {
            debuggable true
            signingConfig signingConfigs.fieldRelease
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.core:core:1.12.0'
}
