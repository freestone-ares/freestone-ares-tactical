name: Build Freestone ARES Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Web Assets Synced
        run: |
          mkdir -p android_app/app/src/main/assets
          cp -r web/* android_app/app/src/main/assets/

      - name: Build Android Debug APK
        working-directory: ./android_app
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../Freestone-ARES-Tactical-v7.8.4.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../Freestone-ARES-Tactical-v7.8.3.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../Freestone-ARES-Tactical.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Freestone-ARES-Tactical-v7.8.4-APK
          path: Freestone-ARES-Tactical-v7.8.4.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v7.8.4
          target_commitish: ${{ github.sha }}
          name: "Freestone ARES Tactical v7.8.4 (Field APK)"
          make_latest: true
          body: |
            ## Freestone County ARES - Tactical Operations Field Build (v7.8.4)
            
            This is the official v7.8.4 standalone Android APK release for Freestone County ARES field operations.
            
            ### Quick Install / Update Instructions for Android:
            - **In Obtainium:** Open Obtainium, tap **Check for updates** (or swipe down to refresh), then tap **Update**.
            - **Direct APK:** Download Freestone-ARES-Tactical-v7.8.4.apk below directly on your Android phone and install.
            
            ### What's New in v7.8.4:
            - **Official Top Banner Layout Alignment:** Re-architected top banner with App Logo on the top left, prominent "Freestone County ARES" across the top, and the interactive Activation Level bar directly underneath.
            - **Eliminated Blinking Guest Sign-In:** Completely removed the pulsing guest sign-in button from the top banner to keep the header clean, calm, and professional.
            - **Restored Full Menu Button:** Dedicated top-right corner placement with unconstrained touch targets ensures the Menu button is 100% visible, fully padded, and never clipped on any Android device.
            - **App Version in Menu Dropdown Bottom:** Placed prominent official version and build badging directly at the bottom of the navigation drawer.
            - **Cleaned Steady State & Security Hardening:** Verified 16-operator active roster, purged test dispatches, steady-state standby posture, and strict Master EC authentication.
          files: |
            Freestone-ARES-Tactical-v7.8.4.apk
            Freestone-ARES-Tactical-v7.8.3.apk
            Freestone-ARES-Tactical.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
