name: Build Freestone ARES Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Web Assets Synced
        run: |
          mkdir -p android_app/app/src/main/assets
          cp -r web/* android_app/app/src/main/assets/

      - name: Setup Android SDK Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Build Android APK and Release AAB
        working-directory: ./android_app
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          ./gradlew bundleRelease --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../Freestone-ARES-Tactical-v7.9.16.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../Freestone-ARES-Tactical.apk
          cp app/build/outputs/bundle/release/*.aab ../Freestone-ARES-Tactical-v7.9.16.aab || cp app/build/outputs/bundle/*/*.aab ../Freestone-ARES-Tactical-v7.9.16.aab
          cp app/build/outputs/bundle/release/*.aab ../Freestone-ARES-Tactical.aab || cp app/build/outputs/bundle/*/*.aab ../Freestone-ARES-Tactical.aab

      - name: Upload APK & Bundle as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Freestone-ARES-Tactical-v7.9.16-Distribution
          path: |
            Freestone-ARES-Tactical-v7.9.16.apk
            Freestone-ARES-Tactical.aab
          retention-days: 30

      - name: Publish GitHub Release with APK & AAB Bundle
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v7.9.16
          target_commitish: ${{ github.sha }}
          name: "Freestone ARES Tactical v7.9.16 Build 68 (Marine-Proof Operator Training Guide & Interactive Slide Deck)"
          make_latest: true
          body: |
            ## Freestone County ARES - Tactical Operations Field Build (v7.9.16 / Build 68)
            
            Universal release for Android Phones & Tablets and Apple iOS, iPadOS, and macOS (Designed for iPad).
            
            ### Package Files Included:
            - **`Freestone-ARES-Tactical.apk` / `Freestone-ARES-Tactical-v7.9.16.apk`**: Standalone Android field installer.
            - **`Freestone-ARES-Tactical.aab` / `Freestone-ARES-Tactical-v7.9.16.aab`**: Signed Android App Bundle for Google Play.
            - **`Freestone_ARES_Tactical_User_Guide.pptx`**: Full 16:9 widescreen PowerPoint presentation guide.
            - **`Freestone_ARES_Tactical_User_Guide.pdf`**: High-resolution printable field booklet.
            
            ### What's New in Build 68:
            - **Interactive In-App Operator Training Guide:** Integrated directly into the Field Manual tab. Features an 18-slide illustrated visual training deck with high-contrast numbered badges matching every screen in the app.
            - **Direct Slide Deck & PDF Export:** One-tap download links inside the app for PowerPoint (`.pptx`) and printable (`.pdf`) editions.
            - **Marine-Proof Step-by-Step Instructions:** Foolproof, zero-jargon actions, "How You Know It Worked" visual confirmations, and field caution boxes for every operational module.
            - **Dedicated Leadership Appendix:** Clearly demarcated appendix covering Emergency Coordinator Brian Davis (`KG5TZT`) authority, County Activation Posture shifts, Siren Paging, and Out-of-Town Delegation.
          files: |
            Freestone-ARES-Tactical-v7.9.16.apk
            Freestone-ARES-Tactical.apk
            Freestone-ARES-Tactical-v7.9.16.aab
            Freestone-ARES-Tactical.aab
            web/Freestone_ARES_Tactical_User_Guide.pptx
            web/Freestone_ARES_Tactical_User_Guide.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
