name: Build Freestone ARES Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Web Assets Synced
        run: |
          mkdir -p android_app/app/src/main/assets
          cp -r web/* android_app/app/src/main/assets/

      - name: Setup Android SDK Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Build Android APK and Release AAB
        working-directory: ./android_app
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          ./gradlew bundleRelease --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../Freestone-ARES-Tactical-v7.9.11.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../Freestone-ARES-Tactical.apk
          cp app/build/outputs/bundle/release/*.aab ../Freestone-ARES-Tactical-v7.9.11.aab || cp app/build/outputs/bundle/*/*.aab ../Freestone-ARES-Tactical-v7.9.11.aab
          cp app/build/outputs/bundle/release/*.aab ../Freestone-ARES-Tactical.aab || cp app/build/outputs/bundle/*/*.aab ../Freestone-ARES-Tactical.aab

      - name: Upload APK & Bundle as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Freestone-ARES-Tactical-v7.9.11-Distribution
          path: |
            Freestone-ARES-Tactical-v7.9.11.apk
            Freestone-ARES-Tactical.aab
          retention-days: 30

      - name: Publish GitHub Release with APK & AAB Bundle
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v7.9.11
          target_commitish: ${{ github.sha }}
          name: "Freestone ARES Tactical v7.9.11 Build 64 (Authentic Motorola QC-II Pair 2 & P25 Sitrep Audio)"
          make_latest: true
          body: |
            ## Freestone County ARES - Tactical Operations Field Build (v7.9.11 / Build 64)
            
            Universal release for Android Phones & Tablets and Apple iOS, iPadOS, and macOS (Designed for iPad).
            
            ### Package Files Included:
            - **`Freestone-ARES-Tactical.apk` / `Freestone-ARES-Tactical-v7.9.11.apk`**: Standalone Android field installer.
            - **`Freestone-ARES-Tactical.aab` / `Freestone-ARES-Tactical-v7.9.11.aab`**: Signed Android App Bundle for Google Play.
            
            ### What's New in Build 63:
            - **Apple Critical Alerts Entitlement:** Configured `com.apple.developer.usernotifications.critical-alerts` capability and authorization request in `AppDelegate.swift`. Emergency activations punch through iOS hardware mute switch, Bedtime, and "Do Not Disturb" focus modes at full siren audio volume with `.critical` interruption level.
            - **Native Bridge Dispatch Integration:** Direct `sendEmergencyAlert` bridge action allowing in-app CAD callouts and emergency dispatches to sound native sirens and display critical lockscreen banners.
            - **Official CR80 CAC-Style Operator ID Card:** High-contrast federal White Common Access Card formatting with exact CR80 physical badge proportions (2.125" × 3.375" / 54mm × 85.6mm) and 1/8" die-cut rounded corners for direct PVC card printing.
            - **Official Freestone County ARES Emblem:** Embedded high-resolution county silhouette with centered red ARRL ARES diamond emblem across all native platforms.
            - **Full NIMS / ICS Training Checklist:** 100% verified certification matrix including ICS-300 and ICS-400, IS-100, IS-200, IS-700, IS-800, IS-701.a, IS-702.a, EC-001, and SKYWARN.
            - **Credential & Identity Alignment:** Standardized EC credentials (DAVIS, BRIAN / KG5TZT / Amateur Extra / Emergency Coordinator), multi-agency IDs (RACES: TX-FREE-01, GMRS: WRPN302, ARES: TX-ARES-01), Maidenhead Grid EM11uv (Streetman, TX), ICE details, and Texas Gov Code Ch. 418 statutory authority.
          files: |
            Freestone-ARES-Tactical-v7.9.11.apk
            Freestone-ARES-Tactical.apk
            Freestone-ARES-Tactical-v7.9.11.aab
            Freestone-ARES-Tactical.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
