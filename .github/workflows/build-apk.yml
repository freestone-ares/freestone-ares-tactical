name: Build Freestone ARES Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Web Assets Synced
        run: |
          mkdir -p android_app/app/src/main/assets
          cp -r web/* android_app/app/src/main/assets/

      - name: Build Android Debug APK
        working-directory: ./android_app
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../Freestone-ARES-Tactical-v7.8.3.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../Freestone-ARES-Tactical-v7.8.2.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../Freestone-ARES-Tactical.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Freestone-ARES-Tactical-v7.8.3-APK
          path: Freestone-ARES-Tactical-v7.8.3.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v7.8.3
          target_commitish: ${{ github.sha }}
          name: "Freestone ARES Tactical v7.8.3 (Field APK)"
          make_latest: true
          body: |
            ## Freestone County ARES - Tactical Operations Field Build (v7.8.3)
            
            This is the official v7.8.3 standalone Android APK release for Freestone County ARES field operations.
            
            ### Quick Install / Update Instructions for Android:
            - **In Obtainium:** Open Obtainium, tap **Check for updates** (or swipe down to refresh), then tap **Update**.
            - **Direct APK:** Download Freestone-ARES-Tactical-v7.8.3.apk below directly on your Android phone and install.
            
            ### What's New in v7.8.3:
            - **Streamlined 1-Row Header & Android View:** Completely decluttered the top row into a compact, razor-sharp tactical navigation bar (~50px) that eliminates vertical crowding on Android devices and removes duplicate sign-in buttons.
            - **Redesigned High-Contrast Sign-In Entrance:** Replaced cluttered tab buttons with an authoritative, clean "SIGN IN" tactical portal featuring a quick roster callsign selector, inline password setup for first-time members, and direct Master EC authentication.
            - **Live HUD Clocks in Hamburger Drawer:** Synchronized Central Military Time (24H) and Astronomical Zulu Time (UTC) integrated right into the top of the mobile navigation menu alongside repeater frequency (FF 110: 145.110 MHz) and grid (EM11xq).
            - **Purged Practice Alerts & Mock Drills:** Removed all fictitious practice dispatches, mock storm reports, and fake parade events; active alerts reset to clean steady state (Incident Counter: 0, Routine Operations).
            - **Authentic Operational Calendar:** Calendar cleaned to display strictly official Freestone County sessions (Weekly Sunday 2000 Net, Monthly 1st Thursday Meeting, and Annual ARRL SET); all fake RSVP callsigns eliminated.
            - **Strict 16-Operator Roster Enforcement:** Automatic scrubbing ensures only the 16 verified county operators (+ County EMC liaison) are loaded; Robert Cockerell (AI5OX) verified GMRS strictly aligned to WSEA569.
            - **Hardened Security & Removed Simulator Backdoors:** Eliminated prototype developer simulator modal; Master EC Brian Davis (KG5TZT) strictly authenticates with password Chief@svfd1.
          files: |
            Freestone-ARES-Tactical-v7.8.3.apk
            Freestone-ARES-Tactical-v7.8.2.apk
            Freestone-ARES-Tactical.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
