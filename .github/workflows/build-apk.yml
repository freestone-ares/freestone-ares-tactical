name: Build Freestone ARES Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Web Assets Synced
        run: |
          mkdir -p android_app/app/src/main/assets
          cp -r web/* android_app/app/src/main/assets/

      - name: Setup Android SDK Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Build Android APK and Release AAB
        working-directory: ./android_app
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          ./gradlew bundleRelease --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../Freestone-ARES-Tactical-v7.9.28.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../Freestone-ARES-Tactical.apk
          cp app/build/outputs/bundle/release/*.aab ../Freestone-ARES-Tactical-v7.9.28.aab || cp app/build/outputs/bundle/*/*.aab ../Freestone-ARES-Tactical-v7.9.28.aab
          cp app/build/outputs/bundle/release/*.aab ../Freestone-ARES-Tactical.aab || cp app/build/outputs/bundle/*/*.aab ../Freestone-ARES-Tactical.aab

      - name: Upload APK & Bundle as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Freestone-ARES-Tactical-v7.9.28-Distribution
          path: |
            Freestone-ARES-Tactical-v7.9.28.apk
            Freestone-ARES-Tactical.apk
            Freestone-ARES-Tactical-v7.9.28.aab
            Freestone-ARES-Tactical.aab
          retention-days: 30

      - name: Publish GitHub Release with APK & AAB Bundle
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v7.9.28
          target_commitish: ${{ github.sha }}
          name: "Freestone ARES Tactical v7.9.28 Build 105 (Official Signed Field Binder 7.5 & 100% Manual Alignment)"
          make_latest: true
          body: |
            ## Freestone County ARES - Tactical Operations Field Build (v7.9.28 / Build 105)
            
            Universal release for Android Phones & Tablets and Apple iOS, iPadOS, and macOS (Designed for iPad).
            
            ### Package Files Included:
            - **`Freestone-ARES-Tactical.apk` / `Freestone-ARES-Tactical-v7.9.28.apk`**: Standalone Android field installer.
            - **`Freestone-ARES-Tactical.aab` / `Freestone-ARES-Tactical-v7.9.28.aab`**: Signed Android App Bundle for Google Play.
            - **`Freestone_ARES_Tactical_User_Guide.pptx`**: Full 16:9 widescreen PowerPoint presentation guide.
            - **`Freestone_ARES_Tactical_User_Guide.pdf`**: High-resolution printable field booklet.
            
            ### What's New in Build 105:
            - **100% Field Manual 7.5 Alignment:** Applied all 8 consistency fixes across PACE Emergency card, channel remarks, EC command status prompt, SKYWARN 6-hazard selector & Four W's, ICS-205 11-block form & 22-channel table, ICS-213 Message Precedence, ICS-214 accountability fields, and operator status classifications.
            - **Bundled Signed Tactical Field Binder 7.5:** Synced the newly signed `Tactical_Field_Binder_7.5.pdf` (81.5 MB, signed by EC Brian Davis 11/01/2026) across all platforms.
            - **Export Compliance (`ITSAppUsesNonExemptEncryption = false`):** Preserved in `Info.plist`.
          files: |
            Freestone-ARES-Tactical-v7.9.28.apk
            Freestone-ARES-Tactical.apk
            Freestone-ARES-Tactical-v7.9.28.aab
            Freestone-ARES-Tactical.aab
            web/Freestone_ARES_Tactical_User_Guide.pptx
            web/Freestone_ARES_Tactical_User_Guide.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
