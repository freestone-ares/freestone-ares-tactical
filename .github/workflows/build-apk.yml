name: Build Freestone ARES Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Web Assets Synced
        run: |
          mkdir -p android_app/app/src/main/assets
          cp -r web/* android_app/app/src/main/assets/

      - name: Setup Android SDK Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Build Android APK and Release AAB
        working-directory: ./android_app
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          ./gradlew bundleRelease --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../Freestone-ARES-Tactical-v7.9.18.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../Freestone-ARES-Tactical.apk
          cp app/build/outputs/bundle/release/*.aab ../Freestone-ARES-Tactical-v7.9.18.aab || cp app/build/outputs/bundle/*/*.aab ../Freestone-ARES-Tactical-v7.9.18.aab
          cp app/build/outputs/bundle/release/*.aab ../Freestone-ARES-Tactical.aab || cp app/build/outputs/bundle/*/*.aab ../Freestone-ARES-Tactical.aab

      - name: Upload APK & Bundle as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Freestone-ARES-Tactical-v7.9.18-Distribution
          path: |
            Freestone-ARES-Tactical-v7.9.18.apk
            Freestone-ARES-Tactical.aab
          retention-days: 30

      - name: Publish GitHub Release with APK & AAB Bundle
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v7.9.18
          target_commitish: ${{ github.sha }}
          name: "Freestone ARES Tactical v7.9.18 Build 70 (Real-Time Azimuth Compass Sensor & Rotating HUD Reticle)"
          make_latest: true
          body: |
            ## Freestone County ARES - Tactical Operations Field Build (v7.9.18 / Build 70)
            
            Universal release for Android Phones & Tablets and Apple iOS, iPadOS, and macOS (Designed for iPad).
            
            ### Package Files Included:
            - **`Freestone-ARES-Tactical.apk` / `Freestone-ARES-Tactical-v7.9.18.apk`**: Standalone Android field installer.
            - **`Freestone-ARES-Tactical.aab` / `Freestone-ARES-Tactical-v7.9.18.aab`**: Signed Android App Bundle for Google Play.
            - **`Freestone_ARES_Tactical_User_Guide.pptx`**: Full 16:9 widescreen PowerPoint presentation guide (Updated for Build 70).
            - **`Freestone_ARES_Tactical_User_Guide.pdf`**: High-resolution printable field booklet (Updated for Build 70).
            
            ### What's New in Build 70:
            - **Real-Time Azimuth Compass Orientation:** Fixed static 285° azimuth issue. Integrated live hardware magnetometer and gyroscope sensors (`webkitCompassHeading`, `deviceorientationabsolute`, and 3D tilt compensation) dynamically tracking real-time bearing on both iOS and Android.
            - **Rotating Compass HUD Reticle:** Viewfinder reticle now features a dynamic rotating dial with 4-cardinal angle ticks (N 0°, E 90°, S 180°, W 270°) synchronized with device orientation.
            - **iOS 13+ Motion Permission Auto-Prompt:** Added 1-tap dedicated compass enable button (`🧭 TAP TO ENABLE IPHONE COMPASS`) and automatic permission binding on camera gestures to satisfy WebKit permission requirements.
            - **Manual Azimuth Presets & Live Pill Highlighting:** Azimuth selector tape now dynamically highlights the nearest cardinal direction button as the operator turns, while supporting stationary manual overrides.
            - **Complete User Guide Synchronization:** User guide slide deck (PPTX and PDF) and in-app viewer updated to Build 70 detailing the live compass engine.
          files: |
            Freestone-ARES-Tactical-v7.9.18.apk
            Freestone-ARES-Tactical.apk
            Freestone-ARES-Tactical-v7.9.18.aab
            Freestone-ARES-Tactical.aab
            web/Freestone_ARES_Tactical_User_Guide.pptx
            web/Freestone_ARES_Tactical_User_Guide.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
