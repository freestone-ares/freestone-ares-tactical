name: Build Freestone ARES Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Web Assets Synced
        run: |
          mkdir -p android_app/app/src/main/assets
          cp -r web/* android_app/app/src/main/assets/

      - name: Setup Android SDK Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Build Android APK and Release AAB
        working-directory: ./android_app
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          ./gradlew bundleRelease --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../Freestone-ARES-Tactical-v7.9.13.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../Freestone-ARES-Tactical.apk
          cp app/build/outputs/bundle/release/*.aab ../Freestone-ARES-Tactical-v7.9.13.aab || cp app/build/outputs/bundle/*/*.aab ../Freestone-ARES-Tactical-v7.9.13.aab
          cp app/build/outputs/bundle/release/*.aab ../Freestone-ARES-Tactical.aab || cp app/build/outputs/bundle/*/*.aab ../Freestone-ARES-Tactical.aab

      - name: Upload APK & Bundle as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Freestone-ARES-Tactical-v7.9.13-Distribution
          path: |
            Freestone-ARES-Tactical-v7.9.13.apk
            Freestone-ARES-Tactical.aab
          retention-days: 30

      - name: Publish GitHub Release with APK & AAB Bundle
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v7.9.13
          target_commitish: ${{ github.sha }}
          name: "Freestone ARES Tactical v7.9.13 Build 65 (Universal Android Camera Cutout & Display Insets Adaptation)"
          make_latest: true
          body: |
            ## Freestone County ARES - Tactical Operations Field Build (v7.9.13 / Build 65)
            
            Universal release for Android Phones & Tablets and Apple iOS, iPadOS, and macOS (Designed for iPad).
            
            ### Package Files Included:
            - **`Freestone-ARES-Tactical.apk` / `Freestone-ARES-Tactical-v7.9.13.apk`**: Standalone Android field installer.
            - **`Freestone-ARES-Tactical.aab` / `Freestone-ARES-Tactical-v7.9.13.aab`**: Signed Android App Bundle for Google Play.
            
            ### What's New in Build 65:
            - **Universal Android Camera Cutout & Window Insets Architecture:** Fully compliant with Android 15 edge-to-edge enforcement. App headers, buttons, and drawer menus dynamically clear front-facing camera punch holes, teardrop notches, and status bars across all Android phone models.
            - **Adaptive Tablet vs. Phone Scaling:** Intelligently consumes system bars and display cutout insets without extra padding on Android tablets, providing native full-screen density on large screens while protecting phone UI elements from camera clipping.
            - **PWA & Standalone Fallback:** Standalone web app mode on Android phones automatically incorporates 38px safe-area top clearance.
            - **Authentic Motorola QC-II Pair 2 & P25 Sitrep Audio:** Pure sinusoidal Texas Fire/EMS dual-tone alert paging and Motorola ASTRO P25 3-chirp talk-permit audio.
            - **Official CR80 CAC-Style Operator ID Card:** High-contrast federal White Common Access Card formatting with verified NIMS/ICS certifications.
          files: |
            Freestone-ARES-Tactical-v7.9.13.apk
            Freestone-ARES-Tactical.apk
            Freestone-ARES-Tactical-v7.9.13.aab
            Freestone-ARES-Tactical.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
