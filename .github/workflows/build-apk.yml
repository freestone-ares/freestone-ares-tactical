name: Build Freestone ARES Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Web Assets Synced
        run: |
          mkdir -p android_app/app/src/main/assets
          cp -r web/* android_app/app/src/main/assets/

      - name: Setup Android SDK Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Build Android APK and Release AAB
        working-directory: ./android_app
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          ./gradlew bundleRelease --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../Freestone-ARES-Tactical-v7.9.27.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../Freestone-ARES-Tactical.apk
          cp app/build/outputs/bundle/release/*.aab ../Freestone-ARES-Tactical-v7.9.27.aab || cp app/build/outputs/bundle/*/*.aab ../Freestone-ARES-Tactical-v7.9.27.aab
          cp app/build/outputs/bundle/release/*.aab ../Freestone-ARES-Tactical.aab || cp app/build/outputs/bundle/*/*.aab ../Freestone-ARES-Tactical.aab

      - name: Upload APK & Bundle as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Freestone-ARES-Tactical-v7.9.27-Distribution
          path: |
            Freestone-ARES-Tactical-v7.9.27.apk
            Freestone-ARES-Tactical.apk
            Freestone-ARES-Tactical-v7.9.27.aab
            Freestone-ARES-Tactical.aab
          retention-days: 30

      - name: Publish GitHub Release with APK & AAB Bundle
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v7.9.27
          target_commitish: ${{ github.sha }}
          name: "Freestone ARES Tactical v7.9.27 Build 103 (Cross-Platform Responsive Engine, Universal Photo Picker & PACE/Spotter Flexbox Alignment)"
          make_latest: true
          body: |
            ## Freestone County ARES - Tactical Operations Field Build (v7.9.27 / Build 103)
            
            Universal release for Android Phones & Tablets and Apple iOS, iPadOS, and macOS (Designed for iPad).
            
            ### Package Files Included:
            - **`Freestone-ARES-Tactical.apk` / `Freestone-ARES-Tactical-v7.9.27.apk`**: Standalone Android field installer.
            - **`Freestone-ARES-Tactical.aab` / `Freestone-ARES-Tactical-v7.9.27.aab`**: Signed Android App Bundle for Google Play.
            - **`Freestone_ARES_Tactical_User_Guide.pptx`**: Full 16:9 widescreen PowerPoint presentation guide.
            - **`Freestone_ARES_Tactical_User_Guide.pdf`**: High-resolution printable field booklet.
            
            ### What's New in Build 103:
            - **Cross-Platform Responsive Layout Engine:** Fluid grids and media queries scaling across smartphones, tablets, laptops, desktops, Raspberry Pi browsers, and NUC mini-PC displays.
            - **Operator ID Photo Universal Picker:** Explicit "Choose Photo" button using universal HTML5/File System Access APIs alongside native camera/gallery wrappers across iOS, Android, macOS, Windows, Linux, and Chromium.
            - **Storm Spotter & PACE Flexbox Alignment:** Re-engineered PACE channel badges (`CH 01` - `CH 22`) and Certified Spotter console layouts to prevent overlapping on all screen sizes.
            - **Export Compliance (`ITSAppUsesNonExemptEncryption = false`):** Preserved in `Info.plist`.
          files: |
            Freestone-ARES-Tactical-v7.9.27.apk
            Freestone-ARES-Tactical.apk
            Freestone-ARES-Tactical-v7.9.27.aab
            Freestone-ARES-Tactical.aab
            web/Freestone_ARES_Tactical_User_Guide.pptx
            web/Freestone_ARES_Tactical_User_Guide.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
