name: Build Freestone ARES Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Web Assets Synced
        run: |
          mkdir -p android_app/app/src/main/assets
          cp -r web/* android_app/app/src/main/assets/

      - name: Build Android Debug APK
        working-directory: ./android_app
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../Freestone-ARES-Tactical-v7.6.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../Freestone-ARES-Tactical-v7.5.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../Freestone-ARES-Tactical-v7.4.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Freestone-ARES-Tactical-v7.6-APK
          path: Freestone-ARES-Tactical-v7.6.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v7.6.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "Freestone ARES Tactical v7.6.${{ github.run_number }} (Field APK)"
          make_latest: true
          body: |
            ## Freestone County ARES - Tactical Operations Field Build (v7.6.${{ github.run_number }})
            
            This is the latest standalone Android APK for Freestone County ARES field operations.
            
            ### Quick Install / Update Instructions for Android:
            - **In Obtainium:** Open Obtainium and tap **Check for updates** (or swipe down to refresh), then tap **Update**.
            - **Direct APK:** Download `Freestone-ARES-Tactical-v7.6.apk` below directly on your Android phone and install.
            
            ### What's New in v7.6:
            - **6-Level Operator Hierarchy & Precision Permissions Matrix:**
              - **Level 1 (Operator):** New person with no prior experience. Can set up in a building/facility and assist experienced operators. Basic privileges.
              - **Level 2 (Field Operator / Spotter):** Certified to operate independently in the field and deploy as a mobile storm spotter during SKYWARN weather activations.
              - **Level 3 (Net Control Station - NCS):** Can do all of Level 1 & 2 plus full access to all NCS features like official Net Script (ARRL preamble) and live NetLogger check-in tools.
              - **Level 4 (Assistant EC - AEC):** Assists the EC in all operational aspects. Granted all operator permissions plus emergency page-out, audio siren activation, and deployment controls.
              - **Level 5 (County EMC):** County Emergency Management Coordinator. Has ALL app permissions EXCEPT alert features (oversight across all logs, ICS forms, and maps without ham radio alert broadcast).
              - **Level 6 (Emergency Coordinator - EC):** Brian Davis (KG5TZT). Master tactical authority with ALL app permissions (EC security desk authorizations, paging, alerts, and bypass).
            - **Hidden Login When App is Active:** Once logged in, the login form is completely hidden from the open app. The top header button displays the operator badge and clearance level, opening an Operator Credentials card.
            - **Dedicated Log Out in Hamburger Dropdown:** Operators can cleanly terminate their session via the red "LOG OUT" button in the top-right hamburger menu.
            - **PACE Channels in Hamburger Menu:** The PACE channel matrix is now accessed cleanly from the top-right Hamburger Menu, streamlining the command dashboard shortcuts.
            - **Permanent Cryptographic Signing:** Signed with the official permanent Freestone County ARES keystore (`field.keystore`) for smooth, error-free Obtainium updates.
          files: |
            Freestone-ARES-Tactical-v7.6.apk
            Freestone-ARES-Tactical-v7.5.apk
            Freestone-ARES-Tactical-v7.4.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
