name: Build Freestone ARES Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Web Assets Synced
        run: |
          mkdir -p android_app/app/src/main/assets
          cp -r web/* android_app/app/src/main/assets/

      - name: Build Android Debug APK
        working-directory: ./android_app
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../Freestone-ARES-Tactical-v7.8.5.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../Freestone-ARES-Tactical.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Freestone-ARES-Tactical-v7.8.5-APK
          path: Freestone-ARES-Tactical-v7.8.5.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v7.8.5
          target_commitish: ${{ github.sha }}
          name: "Freestone ARES Tactical v7.8.5 (Field APK)"
          make_latest: true
          body: |
            ## Freestone County ARES - Tactical Operations Field Build (v7.8.5)
            
            This is the official v7.8.5 standalone Android APK release for Freestone County ARES field operations.
            
            ### Quick Install / Update Instructions for Android:
            - **In Obtainium:** Open Obtainium, tap **Check for updates** (or swipe down to refresh), then tap **Update**.
            - **Direct APK:** Download Freestone-ARES-Tactical-v7.8.5.apk below directly on your Android phone and install.
            
            ### What's New in v7.8.5:
            - **Top Banner Layout Alignment:** Positioned FREESTONE COUNTY ARES centered in the top row with App Logo on the left and full unconstrained Menu button on the right; slim full-width Activation Level bar stretched across the entire length of the banner directly underneath.
            - **Removed Front Page Ver Badges & Added About Modal:** Cleaned front entrance view and added interactive About Tactical Mobile in the slide-out menu drawer and footer detailing version 7.8.5, build 33, EC contact info, and net frequencies.
            - **Centered Tactical Sign-In:** Centered emblem, centered FREESTONE COUNTY ARES, centered TACTICAL COMMUNICATIONS, removed CAD Dispatch Console, and eliminated the ROSTER button for a clean callsign input.
            - **County Generic Password (ARES2026):** All 15 volunteer operators can log in using county standard password ARES2026 or their custom password. Master EC KG5TZT remains strictly Chief@svfd1.
            - **Mandatory Profile Verification & Onboarding:** Pre-filled operator profile prompt on login allows operators to review/edit emergency phone, email, license class, GMRS/RACES (AI5OX verified as WSEA569), FEMA certs, power capability, spotter toggle, and photo ID.
          files: |
            Freestone-ARES-Tactical-v7.8.5.apk
            Freestone-ARES-Tactical.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
