name: Build Freestone ARES Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Web Assets Synced
        run: |
          mkdir -p android_app/app/src/main/assets
          cp -r web/* android_app/app/src/main/assets/

      - name: Setup Android SDK Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Build Android APK and Release AAB
        working-directory: ./android_app
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          ./gradlew bundleRelease --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../Freestone-ARES-Tactical-v7.8.9.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../Freestone-ARES-Tactical.apk
          cp app/build/outputs/bundle/release/*.aab ../Freestone-ARES-Tactical-v7.8.9.aab || cp app/build/outputs/bundle/*/*.aab ../Freestone-ARES-Tactical-v7.8.9.aab
          cp app/build/outputs/bundle/release/*.aab ../Freestone-ARES-Tactical.aab || cp app/build/outputs/bundle/*/*.aab ../Freestone-ARES-Tactical.aab

      - name: Upload APK & Bundle as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Freestone-ARES-Tactical-v7.8.9-Distribution
          path: |
            Freestone-ARES-Tactical-v7.8.9.apk
            Freestone-ARES-Tactical.aab
          retention-days: 30

      - name: Publish GitHub Release with APK & AAB Bundle
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v7.8.9
          target_commitish: ${{ github.sha }}
          name: "Freestone ARES Tactical v7.8.9 (Field APK & Google Play Bundle)"
          make_latest: true
          body: |
            ## Freestone County ARES - Tactical Operations Field Build (v7.8.9)
            
            This is the official v7.8.9 (Build 37) field release for Freestone County ARES operations.
            
            ### Package Files Included:
            - **`Freestone-ARES-Tactical.apk` / `Freestone-ARES-Tactical-v7.8.9.apk`**: Direct standalone Android field installer (for Obtainium & direct sideloading).
            - **`Freestone-ARES-Tactical.aab` / `Freestone-ARES-Tactical-v7.8.9.aab`**: Official signed Android App Bundle for direct upload to the **Google Play Console**.
            
            ### Quick Install / Update Instructions for Android:
            - **In Obtainium:** Open Obtainium, tap **Check for updates** (or swipe down to refresh), then tap **Update**.
            - **Direct APK:** Download Freestone-ARES-Tactical-v7.8.9.apk below directly on your Android phone and install.
            - **Google Play Console:** Upload Freestone-ARES-Tactical.aab to your Google Play Console release track.
            
            ### What's New in v7.8.9 (Build 37):
            - **Alert Purge & Counter Reset Fixed:** Tapping "PURGE ALL EXPIRED ALERTS & RESET COUNTER" now instantly clears active alerts, resets the incident counter to 0, and restores routine Level 4 steady-state monitoring with updated badges and PACE matrix.
            - **Mobile Viewport Overflow Fixed:** Resolved screen clipping and out-of-bounds layout in the Alert Creation and Demobilization consoles on Android mobile devices.
            - **Dedicated Sticky Navigation & Back Buttons:** Added prominent `[ ◀ BACK ]` buttons in the header and footer of alert modals, ensuring operators can easily back out or broadcast without ever getting stuck.
            - **Internal Modal Scrolling:** Re-engineered modal architecture with sticky headers and footers plus smooth internal scrolling (`max-h-[92vh]`) to fit any Android or iOS screen size.
            - **Google Play Bundle (`.aab`) Included:** Pre-compiled Android App Bundle ready for Google Play Store upload.
          files: |
            Freestone-ARES-Tactical-v7.8.9.apk
            Freestone-ARES-Tactical.apk
            Freestone-ARES-Tactical-v7.8.9.aab
            Freestone-ARES-Tactical.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
