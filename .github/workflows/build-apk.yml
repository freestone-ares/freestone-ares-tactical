name: Build Freestone ARES Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Web Assets Synced
        run: |
          mkdir -p android_app/app/src/main/assets
          cp -r web/* android_app/app/src/main/assets/

      - name: Build Android Debug APK
        working-directory: ./android_app
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../Freestone-ARES-Tactical-v7.8.7.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../Freestone-ARES-Tactical.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Freestone-ARES-Tactical-v7.8.7-APK
          path: Freestone-ARES-Tactical-v7.8.7.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v7.8.7
          target_commitish: ${{ github.sha }}
          name: "Freestone ARES Tactical v7.8.7 (Field APK)"
          make_latest: true
          body: |
            ## Freestone County ARES - Tactical Operations Field Build (v7.8.7)
            
            This is the official v7.8.7 (Build 35) standalone Android APK release for Freestone County ARES field operations.
            
            ### Quick Install / Update Instructions for Android:
            - **In Obtainium:** Open Obtainium, tap **Check for updates** (or swipe down to refresh), then tap **Update**.
            - **Direct APK:** Download Freestone-ARES-Tactical-v7.8.7.apk below directly on your Android phone and install.
            
            ### What's New in v7.8.7 (Build 35):
            - **Mandatory Password Change on Initial Login:** Operators cannot move on or bypass the initial login until they replace the temporary county default password (ARES2026) with their own permanent personal password.
            - **Biometric Quick Sign-In (Facial Recognition & Fingerprint):** Operators can toggle on Facial Recognition (Face ID / Face Unlock) and Fingerprint Scanner (Touch ID / Fingerprint) upon initial password change or in their profile.
            - **One-Tap Biometric Sign-In Button:** Added high-contrast one-tap biometric authentication button on the sign-in entrance for instant hands-free field access.
            - **Station Equipment Capabilities Checkboxes:** Full 10 station capability checkboxes dynamically rendered on dashboard cards.
            - **Calendar NCS Management & SKYWARN Console:** 1-tap Net Control assignment and stress-resistant storm spotter transmission with on-air voice script.
            - **Zero-Lag Cloud Synchronization:** Real-time push of member profiles, registrations, and storm reports directly via GitHub API.
          files: |
            Freestone-ARES-Tactical-v7.8.7.apk
            Freestone-ARES-Tactical.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
