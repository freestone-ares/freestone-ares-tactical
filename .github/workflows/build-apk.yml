name: Build Freestone ARES Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Web Assets Synced
        run: |
          mkdir -p android_app/app/src/main/assets
          cp -r web/* android_app/app/src/main/assets/

      - name: Build Android Debug APK
        working-directory: ./android_app
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../Freestone-ARES-Tactical-v7.4.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Freestone-ARES-Tactical-v7.4-APK
          path: Freestone-ARES-Tactical-v7.4.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v7.4.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "Freestone ARES Tactical v7.4.${{ github.run_number }} (Field APK)"
          make_latest: true
          body: |
            ## Freestone County ARES - Tactical Operations Field Build (v7.4.${{ github.run_number }})
            
            This is the latest standalone Android APK for Freestone County ARES field operations.
            
            ### Quick Install / Update Instructions for Android:
            - **In Obtainium:** Open Obtainium and tap **Check for updates** (or swipe down to refresh), then tap **Update**.
            - **Direct APK:** Download `Freestone-ARES-Tactical-v7.4.apk` below directly on your Android phone and install.
            
            ### Included in this build:
            - **Multi-Operator Authentication:** Clean initial state requiring verified operator selection and 6-digit OTP claim (fixes auto-login as EC).
            - **16 Verified Operators Pre-Seeded:** All active county operators loaded with full callsign and credential mapping.
            - **1-Tap Share Modal:** QR code generator and native SMS/Share integration for instant field distribution.
            - **Obtainium Auto-Update Sync:** Semantic version tracking (`v7.4.${{ github.run_number }}`) enabled for automatic over-the-air update detection.
            - **Offline Texas County Maps:** Pre-cached OpenStreetMap tile engine for field comms without internet.
            - **Tactical Field Tools:** ICS-213 form generator, APRS-IS beacon monitor, NetLogger sync, repeater directory.
            - **Direct Dial:** One-touch `📞 CALL` and `💬 SMS` native dialer integration.
          files: Freestone-ARES-Tactical-v7.4.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
