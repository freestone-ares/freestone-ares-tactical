name: Build Freestone ARES Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Web Assets Synced
        run: |
          mkdir -p android_app/app/src/main/assets
          cp -r web/* android_app/app/src/main/assets/

      - name: Build Android Debug APK
        working-directory: ./android_app
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../Freestone-ARES-Tactical-v7.5.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../Freestone-ARES-Tactical-v7.4.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Freestone-ARES-Tactical-v7.5-APK
          path: Freestone-ARES-Tactical-v7.5.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v7.5.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "Freestone ARES Tactical v7.5.${{ github.run_number }} (Field APK)"
          make_latest: true
          body: |
            ## Freestone County ARES - Tactical Operations Field Build (v7.5.${{ github.run_number }})
            
            This is the latest standalone Android APK for Freestone County ARES field operations.
            
            ### Quick Install / Update Instructions for Android:
            - **In Obtainium:** Open Obtainium and tap **Check for updates** (or swipe down to refresh), then tap **Update**.
            - **Direct APK:** Download `Freestone-ARES-Tactical-v7.5.apk` below directly on your Android phone and install.
            
            ### What's New in v7.5:
            - **Single Page View Architecture:** The app strictly displays only one page at a time. No screen stacking, multiple simultaneous views, or confusing step-by-step tutorial headers.
            - **Prominent Top ARES Status:** Sticky top app bar permanently displays the live county readiness status (e.g., `ARES STATUS: STANDBY • NORMAL` with pulsing LED indicator).
            - **Focused Login Card:** Callsign and password entry are centered in a dedicated, single-column card without screen-crowding sidebars.
            - **Dedicated EC Security Desk:** Emergency Coordinator authorization queue and operator level assignment are organized in their own dedicated view (`view-security-desk`).
            - **Professional Hamburger Menu:** Top-right menu drawer (☰) provides direct one-tap navigation across all 10 operational modules.
            - **Role-Based Paging Restrictions:** Incident paging and sirens are locked and grayed out with visual security badges for unauthorized operators.
            - **Master EC Root Access:** Permanent administrator bypass pre-seeded for Emergency Coordinator Brian Davis (KG5TZT).
            - **Permanent Cryptographic Signing:** Signed with the official permanent Freestone County ARES keystore (`field.keystore`) for smooth, error-free Obtainium updates.
          files: |
            Freestone-ARES-Tactical-v7.5.apk
            Freestone-ARES-Tactical-v7.4.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
