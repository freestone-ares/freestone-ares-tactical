name: Build Freestone ARES Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Web Assets Synced
        run: |
          mkdir -p android_app/app/src/main/assets
          cp -r web/* android_app/app/src/main/assets/

      - name: Setup Android SDK Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Build Android APK and Release AAB
        working-directory: ./android_app
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          ./gradlew bundleRelease --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../Freestone-ARES-Tactical-v7.9.2.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../Freestone-ARES-Tactical.apk
          cp app/build/outputs/bundle/release/*.aab ../Freestone-ARES-Tactical-v7.9.2.aab || cp app/build/outputs/bundle/*/*.aab ../Freestone-ARES-Tactical-v7.9.2.aab
          cp app/build/outputs/bundle/release/*.aab ../Freestone-ARES-Tactical.aab || cp app/build/outputs/bundle/*/*.aab ../Freestone-ARES-Tactical.aab

      - name: Upload APK & Bundle as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Freestone-ARES-Tactical-v7.9.2-Distribution
          path: |
            Freestone-ARES-Tactical-v7.9.2.apk
            Freestone-ARES-Tactical.aab
          retention-days: 30

      - name: Publish GitHub Release with APK & AAB Bundle
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v7.9.2
          target_commitish: ${{ github.sha }}
          name: "Freestone ARES Tactical v7.9.2 Build 44 (Universal Phone & Tablet)"
          make_latest: true
          body: |
            ## Freestone County ARES - Tactical Operations Field Build (v7.9.2 / Build 44)
            
            Universal release for Android Phones and Tablets (Cellular & Wi-Fi only) and Apple iOS/iPadOS.
            
            ### Package Files Included:
            - **`Freestone-ARES-Tactical.apk` / `Freestone-ARES-Tactical-v7.9.2.apk`**: Direct standalone Android installer.
            - **`Freestone-ARES-Tactical.aab` / `Freestone-ARES-Tactical-v7.9.2.aab`**: Official signed Android App Bundle for Google Play.
            
            ### What's New in Build 44:
            - **Universal Android Tablet Compatibility:** Full hardware-agnostic support for Wi-Fi only, cellular, and rugged field tablets on Google Play.
            - **All Build 43 Features Included:** 3 County Activation Levels, 2 NCS slots with AEC clearance, EchoLink cleaned, 1-tap cloud sync, tone selector full-width layout, and Dynamic Island safe-area alignment.
          files: |
            Freestone-ARES-Tactical-v7.9.2.apk
            Freestone-ARES-Tactical.apk
            Freestone-ARES-Tactical-v7.9.2.aab
            Freestone-ARES-Tactical.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
