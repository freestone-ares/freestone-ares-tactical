name: Build Freestone ARES Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Web Assets Synced
        run: |
          mkdir -p android_app/app/src/main/assets
          cp -r web/* android_app/app/src/main/assets/

      - name: Build Android Debug APK
        working-directory: ./android_app
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../Freestone-ARES-Tactical-v7.4.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Freestone-ARES-Tactical-v7.4-APK
          path: Freestone-ARES-Tactical-v7.4.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v7.4-field-build
          name: "Freestone ARES Tactical v7.4 (Android Field APK)"
          body: |
            ## Freestone County ARES - Tactical Operations Field Build (v7.4)
            
            This is the direct standalone Android APK for field testing tonight.
            
            ### Quick Install Instructions for Android:
            1. Download `Freestone-ARES-Tactical-v7.4.apk` below directly on your Android phone.
            2. Tap the downloaded file in your browser downloads or Files app.
            3. Tap **Install** (if prompted by Android, allow *"Install unknown apps"* for Chrome/Files).
            4. Launch **Freestone ARES** from your home screen.
            
            ### Included in this build:
            - **Pre-Seeded Verified Roster:** 16 Freestone County operators with passwordless 6-digit OTP login.
            - **Offline Texas County Maps:** Pre-cached OpenStreetMap tile engine for field comms without internet.
            - **Tactical Field Tools:** ICS-213 form generator, APRS-IS beacon monitor, NetLogger sync, repeater directory.
            - **Direct Dial:** One-touch `📞 CALL` and `💬 SMS` native dialer integration.
          files: Freestone-ARES-Tactical-v7.4.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
