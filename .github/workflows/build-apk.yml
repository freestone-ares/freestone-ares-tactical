name: Build Freestone ARES Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Web Assets Synced
        run: |
          mkdir -p android_app/app/src/main/assets
          cp -r web/* android_app/app/src/main/assets/

      - name: Build Android Debug APK
        working-directory: ./android_app
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../Freestone-ARES-Tactical-v7.8.6.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../Freestone-ARES-Tactical.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Freestone-ARES-Tactical-v7.8.6-APK
          path: Freestone-ARES-Tactical-v7.8.6.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v7.8.6
          target_commitish: ${{ github.sha }}
          name: "Freestone ARES Tactical v7.8.6 (Field APK)"
          make_latest: true
          body: |
            ## Freestone County ARES - Tactical Operations Field Build (v7.8.6)
            
            This is the official v7.8.6 (Build 34) standalone Android APK release for Freestone County ARES field operations.
            
            ### Quick Install / Update Instructions for Android:
            - **In Obtainium:** Open Obtainium, tap **Check for updates** (or swipe down to refresh), then tap **Update**.
            - **Direct APK:** Download Freestone-ARES-Tactical-v7.8.6.apk below directly on your Android phone and install.
            
            ### What's New in v7.8.6 (Build 34):
            - **Restored Secure Logon Entrance & Operational Session:** Fixed JavaScript initialization syntax so the clean centered logon screen, PIN authentication, and session handling load instantly.
            - **Restored Unconstrained Hamburger Menu:** Full unclipped menu drawer opening reliably with 100% active operational routes.
            - **Station Equipment Capabilities Checkboxes:** Check/uncheck station capabilities (50W VHF/UHF, HF Portable, HT, Crossband, Winlink RMS, Digital DMR/Fusion, 100Ah+ LiFePO4, Solar Array, Generator, 72-Hr Go-Kit) in both onboarding and self-edit modal, rendering live badges on the dashboard card.
            - **Calendar Event Editor & Net Control (NCS) Assignment:** Full editing of training nets and meetings with 1-tap quick self-assign or clear NCS buttons.
            - **Streamlined SKYWARN Tactical Console:** 5 large 1-tap severe condition buttons (Tornado, Hail, Wind, Flash Flood, Damage) routing reports strictly to Net Control Station / EC with 1-tap repeater voice script and direct EC call button.
            - **Zero-Lag Cloud Synchronization:** Direct authenticated GitHub API communication for instant propagation of operator registrations, capability edits, and storm reports.
            - **Version Placed Strictly in About Modal:** The version and build number are exclusively maintained in the About Tactical Mobile dialog.
          files: |
            Freestone-ARES-Tactical-v7.8.6.apk
            Freestone-ARES-Tactical.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
