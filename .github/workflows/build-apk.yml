name: Build Freestone ARES Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Web Assets Synced
        run: |
          mkdir -p android_app/app/src/main/assets
          cp -r web/* android_app/app/src/main/assets/

      - name: Setup Android SDK Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Build Android APK and Release AAB
        working-directory: ./android_app
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          ./gradlew bundleRelease --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../Freestone-ARES-Tactical-v7.9.7.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../Freestone-ARES-Tactical.apk
          cp app/build/outputs/bundle/release/*.aab ../Freestone-ARES-Tactical-v7.9.7.aab || cp app/build/outputs/bundle/*/*.aab ../Freestone-ARES-Tactical-v7.9.7.aab
          cp app/build/outputs/bundle/release/*.aab ../Freestone-ARES-Tactical.aab || cp app/build/outputs/bundle/*/*.aab ../Freestone-ARES-Tactical.aab

      - name: Upload APK & Bundle as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Freestone-ARES-Tactical-v7.9.7-Distribution
          path: |
            Freestone-ARES-Tactical-v7.9.7.apk
            Freestone-ARES-Tactical.aab
          retention-days: 30

      - name: Publish GitHub Release with APK & AAB Bundle
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v7.9.7
          target_commitish: ${{ github.sha }}
          name: "Freestone ARES Tactical v7.9.7 Build 49 (Active Alert Paging, Option B Roster & NCS Dropdown)"
          make_latest: true
          body: |
            ## Freestone County ARES - Tactical Operations Field Build (v7.9.7 / Build 49)
            
            Universal release for Android Phones & Tablets and Apple iOS, iPadOS, and macOS (Designed for iPad).
            
            ### Package Files Included:
            - **`Freestone-ARES-Tactical.apk` / `Freestone-ARES-Tactical-v7.9.7.apk`**: Standalone Android field installer.
            - **`Freestone-ARES-Tactical.aab` / `Freestone-ARES-Tactical-v7.9.7.aab`**: Signed Android App Bundle for Google Play.
            
            ### What's New in Build 49:
            - **Option B Tactical Roster Card (2x2 Grid):** Top-left features an extra-large 120px square operator photo with emerald neon border, alongside 3 stacked boxes (Name, Callsign, GMRS Call). Directly underneath are ARES ID and RACES ID matching the respective column widths. Right column features equal-width tactical badges (Available, dynamic Unclaimed, Storm Spotter, Net Control, Clearance Level).
            - **Active Alert Emergency Dispatch Paging Engine:** Motorola Quick-Call II paging tones (707.3 Hz / 953.7 Hz) with hardware vibration, continuous background receiving with WebSocket/REST failover, Screen Wake Lock API, and heads-up pop-up alert banner. Fully gated by operator duty status (active when ON DUTY; muted when OFF DUTY).
            - **Net Scheduling NCS Assignment Dropdown:** One-tap modal to assign designated Net Control Station operators directly from an active roster dropdown, with Net Manager position removed.
            - **Dynamic Unclaimed Badge Dismissal:** The Unclaimed badge disappears in real-time across all devices as soon as an operator sets up their profile.
          files: |
            Freestone-ARES-Tactical-v7.9.7.apk
            Freestone-ARES-Tactical.apk
            Freestone-ARES-Tactical-v7.9.7.aab
            Freestone-ARES-Tactical.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
