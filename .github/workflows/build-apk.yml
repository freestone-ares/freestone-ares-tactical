name: Build Freestone ARES Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Web Assets Synced
        run: |
          mkdir -p android_app/app/src/main/assets
          cp -r web/* android_app/app/src/main/assets/

      - name: Build Android Debug APK
        working-directory: ./android_app
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../Freestone-ARES-Tactical-v7.7.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../Freestone-ARES-Tactical-v7.6.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../Freestone-ARES-Tactical-v7.5.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Freestone-ARES-Tactical-v7.7-APK
          path: Freestone-ARES-Tactical-v7.7.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v7.7.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "Freestone ARES Tactical v7.7.${{ github.run_number }} (Field APK)"
          make_latest: true
          body: |
            ## Freestone County ARES - Tactical Operations Field Build (v7.7.${{ github.run_number }})
            
            This is the latest standalone Android APK for Freestone County ARES field operations.
            
            ### Quick Install / Update Instructions for Android:
            - **In Obtainium:** Open Obtainium and tap **Check for updates** (or swipe down to refresh), then tap **Update**.
            - **Direct APK:** Download `Freestone-ARES-Tactical-v7.7.apk` below directly on your Android phone and install.
            
            ### What's New in v7.7:
            - **Mobile Screen Optimization & 2-Line Header Fit:** The top tactical dashboard and header fit 100% cleanly on any mobile viewport without horizontal scrolling or sliding right/left.
            - **Real Optical Night Vision Switcher:** Authentic monochrome optical color filters across the entire app interface:
              - **NV-G:** P-43 Night Vision Phosphor Green
              - **AMB:** Cockpit Amber Low-Light Filter
              - **RED:** Tactical Dark-Adaptation Red Filter
              - **DAY:** Full Standard Multi-Color Day/Night Palette
            - **County Response Level 1-4 Controller:** Emergency Coordinator direct posture dispatch (Level 4 Normal, Level 3 Increased Readiness, Level 2 Advisory, Level 1 Full Activation) synchronized to the top status badge and command dashboard.
            - **Storm Spotter Qualification Across All Levels:** Storm spotter certified credential can now be assigned to any operator level with a dedicated badge.
            - **Operator Deletion & Decommissioning:** EC Brian Davis can permanently decommission and remove operators from the active tactical system.
            - **Comprehensive Operator Profiles:** Roster and accounts now manage Full Legal Name, Callsign, GMRS License, RACES Registration Number, Phone, Email, License Class, Power Deployment Capability, FEMA Certifications, and Professional Photo ID.
            - **EC Profile Editor & Operator Self-Profile Editor:** Dedicated modals for Brian Davis to edit any volunteer profile and for operators to edit their own profile.
            - **Mandatory Professional Photo ID:** Front-facing camera capture requiring a plain white background and no hat on.
            - **Strict Master EC Login:** Master EC login strictly requires Callsign `KG5TZT` and Password `Chief@svfd1`. All auto-login bypasses removed.
            - **Permanent Cryptographic Signing:** Keystore signature preserved for seamless Obtainium updates.
          files: |
            Freestone-ARES-Tactical-v7.7.apk
            Freestone-ARES-Tactical-v7.6.apk
            Freestone-ARES-Tactical-v7.5.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
