name: Build Freestone ARES Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Android APK (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Web Assets Synced
        run: |
          mkdir -p android_app/app/src/main/assets
          cp -r web/* android_app/app/src/main/assets/

      - name: Setup Android SDK Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Build Android APK and Release AAB
        working-directory: ./android_app
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          gradle wrapper --gradle-version 8.11.1
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          ./gradlew bundleRelease --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../Freestone-ARES-Tactical-v7.9.1.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../Freestone-ARES-Tactical.apk
          cp app/build/outputs/bundle/release/*.aab ../Freestone-ARES-Tactical-v7.9.1.aab || cp app/build/outputs/bundle/*/*.aab ../Freestone-ARES-Tactical-v7.9.1.aab
          cp app/build/outputs/bundle/release/*.aab ../Freestone-ARES-Tactical.aab || cp app/build/outputs/bundle/*/*.aab ../Freestone-ARES-Tactical.aab

      - name: Upload APK & Bundle as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Freestone-ARES-Tactical-v7.9.1-Distribution
          path: |
            Freestone-ARES-Tactical-v7.9.1.apk
            Freestone-ARES-Tactical.aab
          retention-days: 30

      - name: Publish GitHub Release with APK & AAB Bundle
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v7.9.1
          target_commitish: ${{ github.sha }}
          name: "Freestone ARES Tactical v7.9.1 Build 43 (Field APK & Google Play Bundle)"
          make_latest: true
          body: |
            ## Freestone County ARES - Tactical Operations Field Build (v7.9.1 / Build 43)
            
            This is the official v7.9.1 (Build 43) production release for Apple TestFlight and Google Play Console.
            
            ### Package Files Included:
            - **`Freestone-ARES-Tactical.apk` / `Freestone-ARES-Tactical-v7.9.1.apk`**: Direct standalone Android field installer (for Obtainium & sideloading).
            - **`Freestone-ARES-Tactical.aab` / `Freestone-ARES-Tactical-v7.9.1.aab`**: Official signed Android App Bundle for Google Play Console.
            
            ### What's New in Build 43:
            - **3 Emergency Activation Levels:** Simplified to Level 1 (Full Activation), Level 2 (Stand By), Level 3 (Monitoring).
            - **Designated Net Control Staffing:** Streamlined to 2 stations with AEC+ authorization gatekeeper.
            - **EchoLink Removal:** Cleaned EchoLink button and badges from dashboard, PACE, and communications plans.
            - **Instant 1-Tap Cloud Sync:** Added header refresh button and mobile pull-to-refresh gesture.
            - **Tone Selector Layout Fix:** Alert tone selector expanded to full width with zero truncation.
            - **iPhone 16 Pro Safe Area:** WKWebView pinned strictly to safeAreaLayoutGuide so menu buttons and Dynamic Island never overlap.
          files: |
            Freestone-ARES-Tactical-v7.9.1.apk
            Freestone-ARES-Tactical.apk
            Freestone-ARES-Tactical-v7.9.1.aab
            Freestone-ARES-Tactical.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
